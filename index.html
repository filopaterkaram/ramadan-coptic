<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج مسابقة رمضان أخضر... استدامة وعبادة </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }
        .card {
            background: linear-gradient(135deg, #166534 0%, #15803d 100%);
            width: 100%;
            max-width: 1250px;
            min-height: 850px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 40px;
            color: white;
            position: relative;
            overflow: hidden;
            border: 4px solid #facc15;
        }

        .watermark-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 8rem;
            color: rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            font-family: 'Amiri', serif;
        }

        .moon-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 4rem;
            color: #facc15;
            filter: drop-shadow(0 0 10px #facc15);
            animation: float 3s ease-in-out infinite;
            z-index: 5;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .star-icon {
            position: absolute;
            color: #facc15;
            animation: blink 2s infinite;
            z-index: 5;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 4.5rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            position: relative;
            z-index: 10;
        }
        .sub-title {
            text-align: center;
            font-size: 1.8rem;
            color: #facc15;
            margin-bottom: 35px;
            font-weight: bold;
            position: relative;
            z-index: 10;
        }

        .search-container {
            max-width: 650px;
            margin: 0 auto 40px auto;
            position: relative;
            z-index: 20;
        }
        .search-box {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #facc15;
            border-radius: 50px;
            padding: 15px 30px;
            width: 100%;
            color: white;
            font-size: 1.3rem;
            outline: none;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        #list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 20;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 10px;
        }
        #list-container::-webkit-scrollbar { width: 8px; }
        #list-container::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }

        .student-item {
            background: rgba(0, 0, 0, 0.25);
            border-right: 6px solid #facc15;
            border-radius: 15px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.4s;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .student-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-5px);
        }

        .student-main-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .student-name { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .student-class { font-size: 0.9rem; color: #dcfce7; opacity: 0.9; }

        .stats-summary {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .summary-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            padding: 5px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-correct { background: #15803d; color: #fff; border: 1px solid #22c55e; }
        .badge-wrong { background: #991b1b; color: #fff; border: 1px solid #ef4444; }
        .badge-missing { background: #4b5563; color: #fff; border: 1px solid #9ca3af; }
        .badge-total { background: #facc15; color: #166534; font-size: 1rem; padding: 8px 15px; }

        .click-hint {
            font-size: 0.75rem;
            color: #facc15;
            margin-top: 5px;
            text-align: left;
            font-style: italic;
        }

        .footer-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px dashed rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        .signature { font-family: 'Amiri', serif; font-size: 1.6rem; color: #facc15; }
        .creator-tag { font-size: 0.9rem; color: rgba(255,255,255,0.7); font-style: italic; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: white;
            color: #1a2e1a;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 30px;
            overflow-y: auto;
            padding: 35px;
            position: relative;
            border: 8px solid #166534;
        }
        
        .honor-box {
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px dashed;
        }
        .honor-success {
            background-color: #dcfce7;
            color: #166534;
            border-color: #22c55e;
        }
        .honor-try-again {
            background-color: #fef9c3;
            color: #854d0e;
            border-color: #facc15;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .day-box {
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eee;
            font-size: 0.8rem;
        }
        .correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
        .wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .missing { background: #f3f4f6; color: #9ca3af; }
    </style>
</head>

    function calculate(ans) {
        let correct = 0, wrong = 0, missing = 0;
        ans.forEach((v, i) => {
            if (v === "سؤالٌ غيرُ مُجابٍ عليه") { missing++; }
            else {
                if (v.trim()[0] === modelAnswers[i]) correct++;
                else wrong++;
            }
        });
        const percentageValue = Math.round((correct / 30) * 100);
        return { 
            c: correct, 
            w: wrong, 
            m: missing, 
            pv: percentageValue,
            p: percentageValue + "%" 
        };
    }

    function render(f = "") {
        const container = document.getElementById('list-container');
        container.innerHTML = '';
        studentsData.map(s => ({...s, st: calculate(s.answers)}))
            .sort((a,b) => b.st.c - a.st.c)
            .filter(s => s.name.includes(f))
            .forEach(s => {
                const div = document.createElement('div');
                div.className = 'student-item';
                div.onclick = () => show(s);
                div.innerHTML = `
                    <div class="student-main-info">
                        <div class="student-name">★ ${s.name}</div>
                        <div class="student-class">الفصل: ${s.class}</div>
                        <div class="click-hint">اضغط لمراجعة التفاصيل أكثر ⮕ ${s.st.pv > 50 ? '🎁 مستحق لتكريم' : ''}</div>
                    </div>
                    <div class="stats-summary">
                        <div class="summary-badge badge-correct"><span>صح</span><span>${s.st.c}</span></div>
                        <div class="summary-badge badge-wrong"><span>خطأ</span><span>${s.st.w}</span></div>
                        <div class="summary-badge badge-missing"><span>باقي</span><span>${s.st.m}</span></div>
                        <div class="summary-badge badge-total"><span>${s.st.p}</span></div>
                    </div>
                `;
                container.appendChild(div);
            });
    }

    function show(s) {
        const stats = calculate(s.answers);
        document.getElementById('modalStudentName').innerText = s.name;
        
        // منطق الملحوظة / التكريم
        const honorBox = document.getElementById('honorNote');
        if (stats.pv >= 50) {
            honorBox.className = "honor-box honor-success";
            honorBox.innerHTML = "🏆 برافو عليك يا بطل! درجتك ممتازة ولك تكريم خاص.. استمر في التميز! ✨";
        } else {
            honorBox.className = "honor-box honor-try-again";
            honorBox.innerHTML = "💪 أداء جيد، لكن شد حيلك المرة الجاية.. الدرجة دي هتتعوض وتكون من الأوائل المرة الجاية إن شاء الله! 🌟";
        }

        document.getElementById('modalStats').innerHTML = `
            <div class="bg-green-100 p-4 rounded-xl text-center"><p class="text-xs text-green-700 font-bold">إجابات صحيحة</p><p class="text-2xl font-bold">${stats.c}</p></div>
            <div class="bg-red-100 p-4 rounded-xl text-center"><p class="text-xs text-red-700 font-bold">إجابات خاطئة</p><p class="text-2xl font-bold">${stats.w}</p></div>
            <div class="bg-yellow-100 p-4 rounded-xl text-center"><p class="text-xs text-yellow-700 font-bold">النسبة المئوية</p><p class="text-2xl font-bold">${stats.p}</p></div>
        `;
        const grid = document.getElementById('dayGrid');
        grid.innerHTML = '';
        s.answers.forEach((v, i) => {
            const isC = v !== "سؤالٌ غيرُ مُجابٍ عليه" && v.trim()[0] === modelAnswers[i];
            const isM = v === "سؤالٌ غيرُ مُجابٍ عليه";
            grid.innerHTML += `<div class="day-box ${isM?'missing':isC?'correct':'wrong'}">
                <b>يوم ${i+1}</b><br><small>ج: ${v}</small><br><small style="opacity:0.6">الصح: ${modelAnswers[i]}</small>
            </div>`;
        });
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function closeModal(e) { if(e.target.id === 'detailsModal') e.target.style.display = 'none'; }
    document.getElementById('searchInput').oninput = (e) => render(e.target.value);
    window.onload = render;
</script>
