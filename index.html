<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة الفائزين - رمضان أخضر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: linear-gradient(135deg, #166534 0%, #15803d 100%);
            width: 100%;
            max-width: 1250px;
            min-height: 800px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            padding: 40px;
            color: white;
            position: relative;
            overflow: hidden;
            border: 8px solid #facc15;
            display: flex;
            flex-direction: column;
        }
        .card::before {
            content: '🌙';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3rem;
            opacity: 0.2;
        }
       .card::after{
            content: 'EL-Producer Filopater Karam🌿';
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 1rem;
            opacity: 0.2;
        }
         .card::backdrop{
            content: '🌿';
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1rem;
            opacity: 0.2;
        }

        .title {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            text-align: center;
            color: #facc15;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(250, 204, 21, 0.3);
            padding-bottom: 10px;
        }
        .student-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 5fr));
            gap: 12px;
            flex-grow: 2;
            overflow-y: auto;
            max-height: 500px;
            padding: 10px;
        }
        .student-list::-webkit-scrollbar {
            width: 10px;
        }
        .student-list::-webkit-scrollbar-thumb {
            background: rgba(250, 204, 21, 0.5);
            border-radius: 10px;
        }
        .student-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 12px 15px;
            border-radius: 12px;
            border-right: 4px solid #facc15;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .student-name {
            font-weight: bold;
            font-size: 1.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .student-info {
            font-size: 0.85rem;
            color: #d1fae5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }
        .stats-group {
            display: flex;
            gap: 5px;
        }
        .badge {
            background: #facc15;
            color: #166534;
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .points-badge {
            background: #ffffff;
            color: #15803d;
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.75rem;
            border: 1px solid #facc15;
        }
        .footer-text {
            text-align: center;
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #facc15;
        }
        .medal {
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1 class="title"> مدرسة الاقباط الثانوية بنين - المنيا</h1>
        <p class="subtitle" id="day-title">اوائل مسابقة "رمضان أخضر... استدامة وعبادة "</p>
        
        <div class="student-list" id="list-container">
            <!-- سيتم إضافة الطلاب هنا تلقائياً بواسطة JavaScript -->
        </div>

        <div class="footer-text">
            تهانينا من اسرة التنمية المستدامة .. ! 🌿✨
        </div>
    </div>

    <script>
        // --- قسم البيانات: يمكنك تعديل الأسماء هنا بسهولة ---
        const config = {
            dayText: " مسابقة \"رمضان أخضر... استدامة وعبادة\"",
            students:[
{ name: "حمزة أحمد مختار", class: "1/1", result: "60%", points: "18" },
{ name: "عمر محمود رمضان", class: "2/2", result: "57%", points: "17" },
{ name: "صموئيل محروس رمزي", class: "2/1", result: "50%", points: "15" },
{ name: "يوسف ماجد فايز", class: "2/2", result: "47%", points: "14" },
{ name: "يوسف احمد عبد السلام", class: "2/2", result: "43%", points: "13" },
{ name: "عبدالرحمن أحمد عادل", class: "2/1", result: "33%", points: "10" },
{ name: "محمد عماد حسين", class: "1/1", result: "30%", points: "9" },
{ name: "روفائيل رضا حزين", class: "3/2", result: "30%", points: "9" },
{ name: "إياد خالد مصطفى حسين", class: "1/2", result: "27%", points: "8" },
{ name: "زياد عماد حسين", class: "2/1", result: "27%", points: "8" }


                // لإضافة طالب جديد:
                // { name: "الاسم", class: "الفصل", result: "100%", points: "عدد النقاط" }
            ]
        };

        function renderCard() {
            document.getElementById('day-title').innerText = config.dayText;
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            config.students.forEach(student => {
                const item = document.createElement('div');
                item.className = 'student-item';
                item.innerHTML = `
                    <div class="student-name"><span class="medal">الطالب : </span>${student.name}</div>
                    <div class="student-info">
                        <span>الفصل: ${student.class}</span>
                        <div class="stats-group">
                            <span class="points-badge">${student.points} نقطة</span>
                            <span class="badge">${student.result}</span>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.onload = renderCard;
    </script>

</body>

</html>
